---
- name: Configure L2 Access Interfaces
  cisco.ios.ios_l2_interfaces:
    config:
      - name: "{{ item.name }}"
        access:
          vlan: "{{ item.access_vlan }}"
        mode: access
    state: merged
  loop: "{{ l2_access }}"
  when: l2_access is defined

- name: Enable Portfast and BPDU Guard on Access Ports
  cisco.ios.ios_config:
    lines:
      - "spanning-tree portfast edge"
      - "spanning-tree bpduguard enable"
    parents: "interface {{ item.name }}"
  loop: "{{ l2_access }}"
  when: l2_access is defined
